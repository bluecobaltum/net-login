# 校园网自动登录配置 (深大 Dr.COM eportal 门户)
# 改完保存即可, 不需要重启服务, 下次检查时自动生效

[account]
# 校园网账号 = 学号
username =
# 校园网密码
password =
# 运营商后缀, 一般留空; 若需要可填 @dx(电信) @lt(联通) 等
suffix =

[portal]
# 认证门户地址; host 留空则每次自动发现(稍慢), 填上可加快登录
host = 172.30.255.42
port = 801
# 账号前缀: auto = 按门户配置自动取(PC 端为 ,0,); off = 不加前缀; 也可直接填 ,0,
account_prefix = auto

[security]
# 只在这些网段内登录: 本机 IP 与门户地址都要落在其中
# 目的: 连上酒店/其他学校/伪造热点等需要认证的网络时, 不会把校园网账号密码发出去
# 想解除限制填 any (不建议)
allow_cidrs = 172.30.0.0/16
# 门户响应里必须出现的特征串(确认是本校门户), 填 any 可关闭
expect_keywords = szu

[runtime]
# 联网探针地址, 命中任意一个即认为能上网
probe_urls = http://cp.cloudflare.com/generate_204, http://www.gstatic.com/generate_204, http://www.baidu.com/
# 单次请求超时(秒)
timeout = 8
# 守护模式检查间隔(秒)
interval = 15
# 登录失败重试次数与间隔(秒)
retry = 3
retry_delay = 5
# 登录后等待多少秒再确认联网
verify_delay = 2
# 账号密码错误时暂停多久再试(秒), 避免反复试导致账号被锁
auth_error_interval = 600
# 登录时上报的 MAC, 一般保持 000000000000 即可
mac = 000000000000
# 登录/失败时弹桌面通知 (只在有图形界面时生效)
notify = false
